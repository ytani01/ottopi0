[default]

[servo]
pins = [16,19,26,20]
angle_factors = [-1,1,-1,1]  # "mpmp"

[rpc]
proto = "http"
host = "0.0.0.0"
port = 8000
apipath = "/api"

[rpcclnt_bt]
prefix = "ms:.4 st:30"
mr_prefix = "ms:0.3 st:10 mr:"

[rpcclnt_bt.keys]
# home
KEY_S = "ca mv:-30,0,0,20 mv:0,0,0,0 mv:20,0,0,-30 mv:0,0,0,0"

# forward
KEY_R = "mv:-30,0,0,20 mv:-20,20,-20,20 mv:0,20,-20,0 mv:20,0,0,-30 mv:20,-20,20,-30 mv:0,-20,20,0"
# backword
KEY_L = "mv:20,0,0,-30 mv:20,20,-20,-20 mv:0,20,-20,0 mv:-30,0,0,20 mv:-30,-20,20,20 mv:0,-20,20,0"

# turn left
KEY_K = "mv:-30,0,0,20 mv:0,-20,-20,20 mv:0,-20,-20,0 mv:20,-20,-20,-30 mv:20,0,0,0 mv:0,0,0,0"
# turn right
KEY_M = "mv:20,0,0,-30 mv:20,-20,-20,0 mv:0,-20,-20,0 mv:-30,-20,-20,20 mv:0,0,0,20 mv:0,0,0,0"

# happy
KEY_O = "ms:.2 mv:-15,0,0,-45, mv:0,0,0,0 mv:-45,0,0,-15 mv:0,0,0,0"

# !!
KEY_N = "ms:.1 st:20 mv:45,0,0,45 sl:.3 mv:0,0,0,0"

[rpcclnt_bt.mr_keys]
KEY_C = [ 5, 0, 0, 0]
KEY_D = [-5, 0, 0, 0]
KEY_E = [0,  5, 0, 0]
KEY_F = [0, -5, 0, 0]
KEY_G = [0, 0,  5, 0]
KEY_I = [0, 0, -5, 0]
KEY_H = [0, 0, 0,  5]
KEY_J = [0, 0, 0, -5]
